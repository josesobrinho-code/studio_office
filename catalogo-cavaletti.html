  <body class="catalog-page">
    <!-- Google Tag Manager (noscript) -->

    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <main>
      <a class="back" href="cadeiras.html" aria-label="Voltar para a página de cadeiras"><img src="assets/studio-office-logo.webp" alt="Studio e Office" /></a>
      <section class="chair-catalog" aria-labelledby="chair-catalog-title">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">Catálogo Cavaletti</p>
            <h1 id="chair-catalog-title">Encontre a linha <em>ideal.</em></h1>
          </div>
          <p>Conheça as coleções disponíveis, veja cada modelo e encontre seus respectivos códigos.</p>
        </div>
        <label class="catalog-search" for="catalog-search-input">
          <span>Buscar no catálogo</span>
          <input id="catalog-search-input" type="search" placeholder="Ex.: Aura, 44.101 ou cadeira executiva" autocomplete="off" />
        </label>
        <p class="catalog-result-count" id="catalog-result-count" aria-live="polite"></p>
        <div class="catalog-product-grid" id="cavaletti-products"></div>
      </section>
    </main>
    <dialog class="catalog-preview" id="catalog-preview" aria-labelledby="catalog-preview-title">
      <button class="catalog-preview-close" type="button" aria-label="Fechar visual">×</button>
      <img id="catalog-preview-image" src="" alt="" />
      <p id="catalog-preview-title"></p>
