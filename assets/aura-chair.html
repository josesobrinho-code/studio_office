<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #fff; }
      #stage { position: relative; cursor: grab; touch-action: none; }
      #stage:active { cursor: grabbing; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: #777; font: 700 10px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage"><p id="loading">Carregando cadeira</p></div>
    <script type="importmap">
      { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { ColladaLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/ColladaLoader.js';

      const stage = document.querySelector('#stage');
      const loading = document.querySelector('#loading');
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      stage.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
      const root = new THREE.Group();
      scene.add(root);

      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d3cb, 2.2));
      const key = new THREE.DirectionalLight(0xffffff, 2.5);
      key.position.set(3, 5, 4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xe8eef0, 1.1);
      fill.position.set(-4, 2, 1);
      scene.add(fill);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: .13 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      function resize() {
        const { clientWidth: width, clientHeight: height } = stage;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      let yaw = -.42;
      let dragging = false;
      let pointerX = 0;
      stage.addEventListener('pointerdown', (event) => { dragging = true; pointerX = event.clientX; stage.setPointerCapture(event.pointerId); });
      stage.addEventListener('pointermove', (event) => { if (dragging) { yaw += (event.clientX - pointerX) * .012; pointerX = event.clientX; root.rotation.y = yaw; } });
      stage.addEventListener('pointerup', () => { dragging = false; });
      window.addEventListener('resize', resize);

      new ColladaLoader().load('aura-44101-cinza/model.dae', (collada) => {
        const chair = collada.scene;
        chair.traverse((node) => {
          if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
        });
        root.add(chair);

        let box = new THREE.Box3().setFromObject(chair);
        const rawSize = box.getSize(new THREE.Vector3());
        const scale = 2.7 / Math.max(rawSize.x, rawSize.y, rawSize.z);
        chair.scale.setScalar(scale);
        box = new THREE.Box3().setFromObject(chair);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        chair.position.x -= center.x;
        chair.position.z -= center.z;
        chair.position.y -= box.min.y;
        floor.position.y = 0;

        const distance = (size.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))) * 1.22;
        camera.position.set(distance * .48, size.y * .7, distance * 1.15);
        camera.lookAt(0, size.y * .54, 0);
        root.rotation.y = yaw;
        loading.remove();
        resize();
      }, undefined, () => { loading.textContent = 'Não foi possível carregar a cadeira'; });

      function render() { requestAnimationFrame(render); renderer.render(scene, camera); }
      resize();
      render();
    </script>
  </body>
</html>
